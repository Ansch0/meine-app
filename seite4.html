<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Auswahl</title>

  <style>

    body {
      margin: 0;
      padding: 30px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 40px;
    }

    .button-bereich {
      max-width: 800px;
      margin: 0 auto;
    }

    .button-gruppe {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .button-gruppe + .button-gruppe {
      margin-top: 70px;
    }

    button {
      width: 100%;
      min-height: 90px;

      font-size: 26px;
      font-weight: bold;

      border: none;
      border-radius: 15px;

      background: #ffffff;

      box-shadow: 0 3px 10px rgba(0,0,0,0.15);

      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

  </style>

</head>

<body>

  <h1>Auswahl</h1>

  <div class="button-bereich">

    <div class="button-gruppe">

      <button onclick="window.location.href='auswahl1.html'">Button 1</button>
      <button onclick="window.location.href='auswahl2.html'">Button 2</button>

      <button onclick="window.location.href='auswahl3.html'">Button 3</button>
      <button onclick="window.location.href='auswahl4.html'">Button 4</button>

      <button onclick="window.location.href='auswahl5.html'">Button 5</button>
      <button onclick="window.location.href='auswahl6.html'">Button 6</button>

      <button onclick="window.location.href='auswahl7.html'">Button 7</button>
      <button onclick="window.location.href='auswahl8.html'">Button 8</button>

    </div>


    <div class="button-gruppe">

      <button onclick="window.location.href='auswahl9.html'">Button 9</button>
      <button onclick="window.location.href='auswahl10.html'">Button 10</button>

      <button onclick="window.location.href='auswahl11.html'">Button 11</button>
      <button onclick="window.location.href='auswahl12.html'">Button 12</button>

      <button onclick="window.location.href='auswahl13.html'">Button 13</button>
      <button onclick="window.location.href='auswahl14.html'">Button 14</button>

      <button onclick="window.location.href='auswahl15.html'">Button 15</button>
      <button onclick="window.location.href='auswahl16.html'">Button 16</button>

    </div>

  </div>

</body>

</html>
