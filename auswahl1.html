<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Auswahl A - CW</title>

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .seite {
      width: 100%;
      height: 100vh;
      box-sizing: border-box;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 30px 20px 70px;
    }

    .inhalt {
      flex: 1;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      width: 100%;
    }

    .karte {
      width: 420px;
      max-width: 80vw;

      background: #151515;

      border: 2px solid #333333;
      border-radius: 24px;

      padding: 25px 45px 30px;

      box-shadow: 0 8px 30px rgba(255,255,255,0.08);
    }

    .titel {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 12px;

      margin-bottom: 20px;
    }

    .titel-a {
      color: rgb(244, 60, 60);

      font-size: 58px;
      font-weight: bold;
    }

    .titel-cw {
      color: #aaaaaa;

      font-size: 24px;
      font-weight: bold;
    }

    .zeile {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      align-items: center;

      color: #ffffff;

      font-size: 30px;
      font-weight: bold;

      padding: 8px 0;
    }

    .links {
      text-align: right;
    }

    .pfeil {
      text-align: center;
      color: #888888;
    }

    .rechts {
      text-align: left;
    }

    .weiter {
      width: min(420px, 80vw);
      min-height: 78px;

      /* mehr Abstand zum unteren Bildschirmrand */
      margin-top: 15px;
      margin-bottom: 35px;

      border: 2px solid #3f8f3f;
      border-radius: 18px;

      background: #163816;
      color: #ffffff;

      font-size: 25px;
      font-weight: bold;

      cursor: pointer;
    }

    .weiter:active {
      transform: scale(0.97);
      background: #245624;
    }

  </style>

</head>

<body>

  <div class="seite">

    <div class="inhalt">

      <div class="karte">

        <div class="titel">
          <span class="titel-a">A</span>
          <span class="titel-cw">CW</span>
        </div>

        <div class="zeile">
          <div class="links">1</div>
          <div class="pfeil">→</div>
          <div class="rechts">3C</div>
        </div>

        <div class="zeile">
          <div class="links">2</div>
          <div class="pfeil">→</div>
          <div class="rechts">B3</div>
        </div>

        <div class="zeile">
          <div class="links">3</div>
          <div class="pfeil">→</div>
          <div class="rechts">2B</div>
        </div>

        <div class="zeile">
          <div class="links">4</div>
          <div class="pfeil">→</div>
          <div class="rechts">A2</div>
        </div>

        <div class="zeile">
          <div class="links">5</div>
          <div class="pfeil">→</div>
          <div class="rechts">1A</div>
        </div>

        <div class="zeile">
          <div class="links">6</div>
          <div class="pfeil">→</div>
          <div class="rechts">D1</div>
        </div>

        <div class="zeile">
          <div class="links">7</div>
          <div class="pfeil">→</div>
          <div class="rechts">4D</div>
        </div>

        <div class="zeile">
          <div class="links">8</div>
          <div class="pfeil">→</div>
          <div class="rechts">C4</div>
        </div>

      </div>

    </div>

    <button
      class="weiter"
      onclick="window.location.href='gemeinsam.html'"
    >
      Weiter →
    </button>

  </div>

</body>

</html>
