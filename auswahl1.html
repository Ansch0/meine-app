<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auswahl 1</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .seite {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 70px 30px 30px;
    }

    .inhalt {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 150px minmax(0, 1fr) 150px;
      align-items: center;
      gap: 30px;
    }

    .bild-bereich {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bild-bereich img {
      display: block;
      max-width: 100%;
      max-height: 85vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .nav-button {
      min-height: 90px;
      border-radius: 18px;
      border: 2px solid #555;
      background: #171717;
      color: #fff;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255,255,255,0.08);
    }

    .nav-button:active {
      transform: scale(0.96);
      background: #2a2a2a;
    }

    .weiter {
      border-color: #3f8f3f;
      background: #163816;
    }

    .weiter:active {
      background: #245624;
    }

    @media (max-width: 900px) {
      .seite {
        padding: 55px 20px 20px;
      }

      .inhalt {
        grid-template-columns: 120px minmax(0, 1fr) 120px;
        gap: 20px;
      }

      .nav-button {
        min-height: 80px;
        font-size: 20px;
      }

      .bild-bereich img {
        max-height: 70vh;
      }
    }
  </style>
</head>

<body>
  <div class="seite">
    <div class="inhalt">

      <button class="nav-button"
        onclick="window.location.href='seite4.html'">
        ← Zurück
      </button>

      <div class="bild-bereich">
        <img src="auswahl1.jpg" alt="Auswahl 1">
      </div>

      <button class="nav-button weiter"
        onclick="window.location.href='gemeinsam.html'">
        Weiter →
      </button>

    </div>
  </div>
</body>
</html>
