<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Auswahl 1</title>

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .seite {
      width: 100%;
      height: 100vh;
      box-sizing: border-box;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 40px 20px 30px;
    }

    .bild-bereich {
      flex: 1;
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .bild-bereich img {
      display: block;

      max-width: 90%;
      max-height: 65vh;

      width: auto;
      height: auto;

      object-fit: contain;

      /* BILD WIRKLICH AUF 150 % ZOOMEN */
      transform: scale(1.5);
      transform-origin: center center;
    }

    .weiter {
      width: min(420px, 80vw);
      min-height: 78px;

      margin-top: 25px;

      border: 2px solid #3f8f3f;
      border-radius: 18px;

      background: #163816;
      color: white;

      font-size: 25px;
      font-weight: bold;

      cursor: pointer;
    }

    .weiter:active {
      transform: scale(0.97);
      background: #245624;
    }

  </style>
</head>


<body>

  <div class="seite">

    <div class="bild-bereich">

      <img
        src="auswahl1.jpg"
        alt="Auswahl 1"
      >

    </div>


    <button
      class="weiter"
      onclick="window.location.href='gemeinsam.html'"
    >
      Weiter →
    </button>

  </div>

</body>

</html>
