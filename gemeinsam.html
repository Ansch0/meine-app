<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Übersicht</title>

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;

      background: #000000;

      overflow: hidden;
    }

    .seite {
      width: 100%;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .seite img {
      display: block;

      max-width: 95vw;
      max-height: 90vh;

      width: auto;
      height: auto;

      object-fit: contain;
    }

  </style>

</head>

<body>

  <div class="seite">

    <img
      src="gemeinsam.jpg"
      alt="Übersicht"
    >

  </div>

</body>

</html>
