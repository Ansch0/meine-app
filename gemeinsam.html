<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Übersicht</title>

  <style>

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;

      background: #000000;

      overflow-x: hidden;
      overflow-y: auto;
    }

    .seite {
      width: 100%;
      min-height: 100svh;
      box-sizing: border-box;
      padding: 12px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .seite img {
      display: block;

      max-width: 96vw;
      max-height: 92svh;

      width: auto;
      height: auto;

      object-fit: contain;
    }

  </style>

</head>

<body>

  <div class="seite">

    <img
      src="gemeinsam.jpg"
      alt="Übersicht"
    >

  </div>

</body>

</html>
